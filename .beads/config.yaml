# bd 1.0.x server-mode config for this repo.
#
# Connection details (host, port, user, password, TLS) come from
# environment variables set by the org-root .envrc plus the central
# config at ~/.config/beads/server.json. They are NOT stored here so
# the same .beads/ works on every machine and across credential
# rotations.
#
# Issue prefix for this repository. It is also set in .beads/metadata.json
# (alongside dolt_mode and dolt_database); bd reads one `issue-prefix` key:
# the BD_ISSUE_PREFIX environment variable when set, else this value, else
# the metadata.json value copied in at startup. So this key wins for every
# reader (`bd create` and `bd linear sync --pull` alike) unless the variable
# overrides it, and nothing checks that the two files agree; keep them
# equal. `linear.pull_label` keeps that pull inside this repo's Linear
# issues; Linear is the tracker of record (see .punt-labs/punt/CLAUDE.md).
issue-prefix: points
linear.pull_label: repo:points

directory:
  labels:
    points: repo:points

backup:
  enabled: false
export:
  auto: false
  git-add: false
