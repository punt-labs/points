# golangci-lint v2 configuration. Keep the tool version synchronized with the
# Makefile and .github/workflows/ci.yml.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 20
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*

formatters:
  enable:
    - gofmt
